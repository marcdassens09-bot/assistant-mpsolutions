name: Security tests
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run site security tests
        env:
          ANTHROPIC_API_KEY: test-placeholder
        run: python -m unittest -v tests/test_site_security.py
      - name: Run live Render integration tests
        run: python tests/live_render_check.py
